<?xml-stylesheet type="text/css" href="diagram-font.css"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">言語モデルの入出力</title>
  <desc id="desc">文字列を言語モデルに渡すと、次に来る語の確率が返る</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f4a40"/>
    </marker>
  </defs>
  <style>
    text { font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif; }
    .box { stroke: #14140f; stroke-width: 3; }
    .main { font-size: 29px; font-weight: 600; text-anchor: middle; }
    .arrow { stroke: #4f4a40; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <rect class="box" fill="#f6e9c6" x="25" y="50" width="280" height="90"/>
  <text class="main" x="165" y="105">むかしむかし</text>
  <line class="arrow" x1="330" y1="95" x2="385" y2="95"/>
  <rect class="box" fill="#d5e8e5" x="405" y="50" width="280" height="90"/>
  <text class="main" x="545" y="105">言語モデル</text>
  <line class="arrow" x1="710" y1="95" x2="765" y2="95"/>
  <rect class="box" fill="#f7ded2" x="785" y="50" width="390" height="90"/>
  <text class="main" x="980" y="88">ある: 0.41　、: 0.22</text>
  <text class="main" x="980" y="120">お: 0.07　…</text>
</svg>
