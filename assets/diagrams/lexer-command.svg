<?xml-stylesheet type="text/css" href="diagram-font.css"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">文字列から命令を実行する流れ</title>
  <desc id="desc">文字列を分割し、辞書から対応する関数を引いて実行する</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f4a40"/>
    </marker>
  </defs>
  <style>
    text { font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif; }
    .box { stroke: #14140f; stroke-width: 3; }
    .main { font-size: 26px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #4f4a40; font-size: 20px; text-anchor: middle; }
    .arrow { stroke: #4f4a40; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <rect class="box" fill="#f6e9c6" x="20" y="48" width="250" height="88"/>
  <text class="main" x="145" y="101">"shout hello"</text>
  <line class="arrow" x1="290" y1="92" x2="325" y2="92"/>
  <rect class="box" fill="#d5e8e5" x="345" y="48" width="185" height="88"/>
  <text class="main" x="437" y="88">split</text>
  <text class="sub" x="437" y="116">字句解析</text>
  <line class="arrow" x1="550" y1="92" x2="585" y2="92"/>
  <rect class="box" fill="#d5e8e5" x="605" y="48" width="250" height="88"/>
  <text class="main" x="730" y="88">COMMANDS[name]</text>
  <text class="sub" x="730" y="116">ディスパッチ</text>
  <line class="arrow" x1="875" y1="92" x2="910" y2="92"/>
  <rect class="box" fill="#f7ded2" x="930" y="48" width="240" height="88"/>
  <text class="main" x="1050" y="101">HELLO!!</text>
</svg>
