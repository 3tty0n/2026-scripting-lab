<?xml-stylesheet type="text/css" href="diagram-font.css"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Forthのディスパッチループ</title>
  <desc id="desc">トークンを読み、辞書を引き、数値やワードに応じて処理する</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f4a40"/>
    </marker>
  </defs>
  <style>
    text { font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif; }
    .box { stroke: #14140f; stroke-width: 3; }
    .main { font-size: 26px; font-weight: 600; text-anchor: middle; }
    .small { font-size: 22px; text-anchor: middle; }
    .read { fill: #d5e8e5; }
    .get { fill: #f6e9c6; }
    .eval { fill: #f7ded2; }
    .action { fill: #14140f; stroke: #14140f; stroke-width: 3; }
    .action-text { fill: #faf8f4; font-size: 22px; text-anchor: middle; }
    .arrow { stroke: #4f4a40; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <rect class="box read" x="40" y="35" width="270" height="85"/>
  <text class="main" x="175" y="88">トークンを読む</text>
  <line class="arrow" x1="330" y1="77" x2="375" y2="77"/>
  <rect class="box get" x="395" y="35" width="270" height="85"/>
  <text class="main" x="530" y="88">辞書を引く</text>
  <line class="arrow" x1="685" y1="77" x2="730" y2="77"/>
  <rect class="box eval" x="750" y="35" width="310" height="85"/>
  <text class="main" x="905" y="88">スタックを操作する</text>
  <path class="arrow" fill="none" d="M905 135 V175 H200 V135"/>
  <line class="arrow" x1="200" y1="190" x2="200" y2="235"/>
  <line class="arrow" x1="530" y1="190" x2="530" y2="235"/>
  <line class="arrow" x1="860" y1="190" x2="860" y2="235"/>
  <rect class="box" fill="#faf8f4" x="70" y="255" width="260" height="65"/>
  <text class="small" x="200" y="295">数値だった</text>
  <rect class="action" x="70" y="335" width="260" height="55"/>
  <text class="action-text" x="200" y="370">スタックに push</text>
  <rect class="box" fill="#faf8f4" x="400" y="255" width="260" height="65"/>
  <text class="small" x="530" y="295">ワードだった</text>
  <rect class="action" x="400" y="335" width="260" height="55"/>
  <text class="action-text" x="530" y="370">対応する関数を呼ぶ</text>
  <rect class="box" fill="#faf8f4" x="730" y="255" width="260" height="65"/>
  <text class="small" x="860" y="295">未知のワード</text>
  <rect class="action" x="730" y="335" width="260" height="55"/>
  <text class="action-text" x="860" y="370">エラー</text>
</svg>
