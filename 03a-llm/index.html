<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/reset.min.css">

<body>

<!--
  スライドの中身は slides.md にある。編集するのはそちらだけでよい。
  区切り: 横スライドは「---」、縦スライドは「--」を単独行で置く。
  ローカルで見るときは、リポジトリの直下で python3 -m http.server を動かすこと
  (file:// で開くと slides.md を読み込めない)。
-->

<div class="reveal">
  <div class="slides">
    <section data-markdown="slides.md"
             data-separator="^\r?\n---\r?\n"
             data-separator-vertical="^\r?\n--\r?\n"
             data-charset="utf-8">
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.1/reveal.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/keybinding-emacs.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
