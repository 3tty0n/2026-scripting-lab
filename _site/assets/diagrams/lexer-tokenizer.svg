<?xml-stylesheet type="text/css" href="diagram-font.css"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">トークナイザの入出力</title>
  <desc id="desc">文章をトークンに分割する</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f4a40"/>
    </marker>
  </defs>
  <style>
    text { font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif; }
    .box { stroke: #14140f; stroke-width: 3; }
    .main { font-size: 27px; font-weight: 600; text-anchor: middle; }
    .token { fill: #faf8f4; stroke: #14140f; stroke-width: 2; }
    .arrow { stroke: #4f4a40; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <rect class="box" fill="#f6e9c6" x="20" y="50" width="300" height="90"/>
  <text class="main" x="170" y="105">"今日はいい天気"</text>
  <line class="arrow" x1="345" y1="95" x2="390" y2="95"/>
  <rect class="box" fill="#d5e8e5" x="410" y="50" width="230" height="90"/>
  <text class="main" x="525" y="105">トークナイザ</text>
  <line class="arrow" x1="665" y1="95" x2="710" y2="95"/>
  <g transform="translate(730 50)">
    <rect class="token" x="0" y="0" width="95" height="90"/>
    <rect class="token" x="101" y="0" width="95" height="90"/>
    <rect class="token" x="202" y="0" width="95" height="90"/>
    <rect class="token" x="303" y="0" width="95" height="90"/>
    <text class="main" x="47" y="56">今日</text>
    <text class="main" x="148" y="56">は</text>
    <text class="main" x="249" y="56">いい</text>
    <text class="main" x="350" y="56">天気</text>
  </g>
</svg>
