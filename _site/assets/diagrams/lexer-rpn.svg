<?xml-stylesheet type="text/css" href="diagram-font.css"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">入力をトークンに分ける流れ</title>
  <desc id="desc">入力文字列を split で分け、トークン列にする</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f4a40"/>
    </marker>
  </defs>
  <style>
    text { font-family: "IBM Plex Sans JP", "Hiragino Sans", sans-serif; }
    .box { stroke: #14140f; stroke-width: 3; }
    .main { font-size: 27px; font-weight: 600; text-anchor: middle; }
    .token { fill: #faf8f4; stroke: #14140f; stroke-width: 2; }
    .arrow { stroke: #4f4a40; stroke-width: 4; marker-end: url(#arrow); }
  </style>
  <rect class="box" fill="#f6e9c6" x="20" y="52" width="270" height="76"/>
  <text class="main" x="155" y="99">"3 4 + 2 *"</text>
  <line class="arrow" x1="305" y1="90" x2="345" y2="90"/>
  <rect class="box" fill="#d5e8e5" x="365" y="52" width="175" height="76"/>
  <text class="main" x="452" y="99">split()</text>
  <line class="arrow" x1="555" y1="90" x2="595" y2="90"/>
  <g transform="translate(615 52)">
    <rect class="token" x="0" y="0" width="78" height="76"/>
    <rect class="token" x="84" y="0" width="78" height="76"/>
    <rect class="token" x="168" y="0" width="78" height="76"/>
    <rect class="token" x="252" y="0" width="78" height="76"/>
    <rect class="token" x="336" y="0" width="78" height="76"/>
    <text class="main" x="39" y="49">3</text>
    <text class="main" x="123" y="49">4</text>
    <text class="main" x="207" y="49">+</text>
    <text class="main" x="291" y="49">2</text>
    <text class="main" x="375" y="49">*</text>
  </g>
</svg>
