# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JS deps
        run: npm ci
      - name: Install pandoc and TeX for handouts and Beamer
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-luatex texlive-lang-japanese \
            texlive-latex-recommended texlive-latex-extra librsvg2-bin poppler-utils
      - name: Build JupyterLite
        run: npx slidekit-jupyter-lite
      - name: Build handouts and Beamer (PDF)
        run: make pdfs
      - name: Build site
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
