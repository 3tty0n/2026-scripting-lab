# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build JupyterLite
        # ブラウザの中で動く Jupyter をサイトに同梱する。
        # 学生は何も入れずに、リンク1つで課題を開いて書ける。
        # 第3回A は torch が要るので Colab を使わせる。ブラウザで動く
        # WebLLM 版 (torch 不要) だけを同梱する。
        run: |
          pip install jupyterlite-core==0.8.3 jupyterlite-pyodide-kernel==0.8.5 jupyter-server
          mkdir -p _lite_contents
          cp exercises/01_basics.ipynb exercises/02_text.ipynb \
             exercises/03b_forth.ipynb exercises/03a_llm_webllm.ipynb _lite_contents/
          cp grading/autograde.py grading/contracts.py grading/notebook.py _lite_contents/
          cp -r grading/checks _lite_contents/checks
          # 第2回で使う長文。取れなければノートブック側が代用を作る
          curl -sL --max-time 60 https://www.gutenberg.org/files/11/11-0.txt \
            -o _lite_contents/alice.txt || rm -f _lite_contents/alice.txt
          jupyter lite build --contents _lite_contents --output-dir lite
          rm -rf _lite_contents .jupyterlite.doit.db
      - name: Drop solutions
        # 模範解答はサイトに載せない (リポジトリは private だが Pages は公開)
        run: rm -rf exercises/solutions
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
